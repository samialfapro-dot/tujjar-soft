<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجار سوفت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color: #090e1c; font-family: sans-serif; }</style>
</head>
<body class="text-white flex flex-col justify-between min-h-screen p-5 text-center">
  <header class="py-4 border-b border-slate-800">
    <div class="w-12 h-12 rounded-xl bg-sky-500 text-slate-950 text-2xl font-bold flex items-center justify-center mx-auto mb-2">ت</div>
    <h1 class="text-lg font-bold">تجار سوفت (Tujjar Soft)</h1>
    <p class="text-xs text-sky-400">نظام الكاشير ونقاط البيع الأوفلاين</p>
  </header>

  <main class="my-auto space-y-4">
    <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800">
      <p class="text-sm text-slate-400">الكاشير: أحمد العماري</p>
      <h2 class="text-xl font-bold text-emerald-400 mt-1">الوردية الصباحية جاهزة</h2>
    </div>
    <button onclick="alert('مرحباً بك! النظام يعمل بنجاح على هاتفك')" class="w-full py-4 bg-sky-500 active:scale-95 text-slate-950 font-bold text-base rounded-2xl shadow-lg">
      دخول نقطة البيع (POS) ➜
    </button>
  </main>

  <footer class="text-xs text-slate-500">
    تجار سوفت • 100% Offline SQLite
  </footer>
</body>
</html>
