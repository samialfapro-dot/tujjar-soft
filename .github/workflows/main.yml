 yaml name: Build Tujjar Soft APK on: push: branches: [ main ] workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v3 - uses: actions/setup-node@v3 with: node-version: 18 - uses: actions/setup-java@v3 with: distribution: 'zulu' java-version: '17' - uses: android-actions/setup-android@v2 - run: npm install - run: npx cap add android || true - run: npx cap sync android - run: cd android && chmod +x gradlew && ./gradlew assembleDebug - uses: actions/upload-artifact@v3 with: name: tujjar-soft-release-apk path: android/app/build/outputs/apk/debug/app-debug.apk
